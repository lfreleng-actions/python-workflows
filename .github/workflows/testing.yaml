---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable workflows in this repository against three of the
# largest downstream Python consumers, and an in-repository fixture, in
# parallel, to prove the reusable workflows function end-to-end:
#   * dependamerge  (standard single-arch) -> build-test.yaml
#   * lftools-uv    (standard single-arch) -> build-test.yaml
#   * python-nss-ng (multi-arch C build)   -> build-test-multiarch.yaml
#   * tests/fixtures/grype-gate (fixture)  -> build-test.yaml
#
# The reusable workflows are referenced with the self-repository form
# ('$/'), which resolves this repository at the commit already
# running, so the workflows under test are always the ones this
# branch defines. The standard targets are
# checked out at their default/HEAD branch; the python-nss-ng leg is
# pinned to the v1.2.0 release commit (see ref: below).
#
# The dependamerge and python-nss-ng legs run the dependencies-changed
# Grype gate. Each builds another repository, which the
# repository-metadata job cannot compare against this pull request, so
# the verdict is unresolved and the gate stays on. The fixture leg
# builds this pull request itself, so its verdict resolves, and it
# watches only the docker preset, which nothing in the fixture matches:
# the gate must drop. grype-gate-assert proves both from the run, and
# grype-gate-wiring reads the workflow files for the wiring no run can
# show.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: a manual run happens on the default branch,
  # which would hand this job a cache token with write access to the
  # default-branch scope while it builds and tests third-party
  # consumer repositories. Untrusted code from those repositories
  # could then poison caches that later runs restore (CWE-349).
  # Pull request runs write only to their own cache scope.
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Standard single-arch consumers, fanned out in parallel via a matrix.
  # Each leg passes its own artifact_suffix: both call build-test.yaml
  # in the same run, and unsuffixed artefact names would collide, so
  # the leg whose upload the other hid would fail its Grype download.
  standard:
    name: 'Standard (${{ matrix.name }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Another repository at its default branch, so the change
          # cannot be resolved and the gate must stay on: this
          # exercises the fail-closed path through the SBOM artefact
          - name: 'dependamerge'
            repository: lfreleng-actions/dependamerge
            grype_gate_when: 'dependencies-changed'
          # Today's behaviour: detection never runs, no gate step
          - name: 'lftools-uv'
            repository: lfreleng-actions/lftools-uv
            grype_gate_when: 'always'
    permissions:
      contents: read
      pull-requests: read  # Reusable workflow reads PR metadata
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      artifact_suffix: '-${{ matrix.name }}'
      grype_gate_when: ${{ matrix.grype_gate_when }}
      # Exercise the allow-list inputs without granting anything new.
      # A same-organisation list may follow its default branch, and
      # 'lfreleng-actions//' resolves to the organisation list itself,
      # which de-duplication absorbs. The organisation list already
      # carries github.com:443, so the action reports it as redundant.
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # Multi-arch C consumer (runs in parallel with the standard matrix).
  #
  # python-nss-ng provides the committed native setup script
  # (.github/scripts/setup-nss.sh) consumed via the setup_script input.
  # Pinned to the v1.2.0 release commit of the upstream repository.
  multiarch:
    name: 'Multi-Arch'
    permissions:
      contents: read
      pull-requests: read  # Reusable workflow reads PR metadata
    uses: $/.github/workflows/build-test-multiarch.yaml
    with:
      repository: lfreleng-actions/python-nss-ng
      ref: e6e197516189faac861f191a6a48f0e1d993ef3d  # v1.2.0
      make: true
      make_args: 'deps-nss env-github-actions'
      setup_script: '.github/scripts/setup-nss.sh'
      # A fixture at a pinned commit of another repository: unresolved,
      # so each SBOM leg's in-leg Grype step keeps the gate on
      grype_gate_when: 'dependencies-changed'

  # The resolved path: a project in this repository, so the
  # repository-metadata job checks out this pull request and compares
  # it with its parent. Only the docker preset is watched, and no
  # Dockerfile sits in or above the fixture, so the verdict is a
  # deterministic 'false' whatever else the pull request changes. The
  # steps that add nothing to the gate are off.
  fixture:
    name: 'Fixture (grype-gate)'
    permissions:
      contents: read
      pull-requests: read  # Reusable workflow reads PR metadata
    uses: $/.github/workflows/build-test.yaml
    with:
      path_prefix: 'tests/fixtures/grype-gate'
      artifact_suffix: '-grype-gate-fixture'
      tests_enabled: false
      audit_enabled: false
      cbom_enabled: false
      grype_gate_when: 'dependencies-changed'
      grype_dependency_ecosystems: 'docker'

  # The dependencies-changed gate trusts the verdict the
  # repository-metadata job computes and hands grype-scan-action as
  # dependencies-changed. The action's own suite proves the verdict;
  # tests/test-grype-gate-inputs.sh proves the wiring around it in all
  # four workflows: the pinned call and its inputs, the checkout depth
  # it needs (actions/checkout fetches one commit by default, and the
  # comparison needs the parent), the job output guarded by the job's
  # result, the policy and detection inputs with their defaults and
  # pass-throughs, and the gerrit-validate steps, which it extracts and
  # drives against every value they must reject.
  # tests/test-grype-sbom-binding.sh proves the scan reads its own
  # call's artefact. Both scripts run as pre-commit hooks.
  grype-gate-wiring:
    name: 'Test: Grype gate wiring'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Assert Grype gate wiring and input validation'
        shell: bash
        run: |
          # Assert Grype gate wiring and input validation
          if ! bash tests/test-grype-gate-inputs.sh; then
            echo "Grype gate wiring incorrect ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Grype gate wiring correct ✅" >> "$GITHUB_STEP_SUMMARY"

      # The scan has to read its own call's SBOM: by the upload's ID,
      # or in the leg that wrote it. A download by name would hand a
      # call that shares a name with a later one the other call's
      # SBOM. The standard legs pass distinct suffixes, so a run
      # cannot show this; the script reads it from the workflow files.
      - name: 'Assert the Grype scan is bound to the SBOM upload'
        shell: bash
        run: |
          # Assert the Grype scan is bound to the SBOM upload
          if ! bash tests/test-grype-sbom-binding.sh; then
            echo "Grype scan not bound to its SBOM ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Grype scan bound to its SBOM ✅" >> "$GITHUB_STEP_SUMMARY"

  # Proves the gate verdicts from the run itself, not just that the job
  # graph went green. Each consumer dependencies-changed leg builds
  # another repository, which the repository-metadata job cannot
  # compare against this pull request: the verdict is empty and the
  # Grype step keeps the gate on. The fixture leg resolves to 'false'
  # and the Grype step drops the gate. Runs whatever the legs'
  # verdicts, so a CVE in a consumer cannot hide these checks.
  grype-gate-assert:
    name: 'Test: Grype gate follows the dependency verdict'
    runs-on: ubuntu-latest
    needs: ['standard', 'multiarch', 'fixture']
    if: ${{ !cancelled() }}
    permissions:
      actions: read  # list this run's jobs and download its artefacts
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The step below sources this helper for its read-only listing,
      # so one transient 5xx cannot fail the job. It buffers each
      # attempt and prints only a complete one, so a page that failed
      # mid-pagination is never half-printed; after the third failure
      # it returns non-zero, having shown gh's own error each time.
      - name: 'Define gh_api retry helper'
        shell: bash
        run: |
          # Define gh_api retry helper
          set -euo pipefail
          cat > "${RUNNER_TEMP}/gh-api.sh" << 'EOF'
          gh_api() {
            local attempt delay out
            for attempt in 1 2 3; do
              if out="$(gh api "$@")"; then
                printf '%s\n' "${out}"
                return 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi
              delay="$((attempt * 5))"
              echo "::warning::gh api failed, attempt ${attempt} of 3;" \
                "retrying in ${delay}s" >&2
              sleep "${delay}"
            done
          }
          EOF

      # A called workflow's step outputs never reach the caller, so the
      # Grype step's gate-active output is read from the step name that
      # carries it ('Grype gate active: true'), which the jobs listing
      # shows. The always leg must have skipped that step: its gate is
      # on by construction, and the summary would say nothing new. A
      # skipped step's name may stay unrendered, so only its conclusion
      # is checked.
      - name: 'Assert the gate follows the dependency verdict'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # Keep in step with the standard matrix names and the
          # multiarch runners default. The in-leg Grype step of a
          # multi-arch SBOM job runs in that job.
          ARMED: |
            Standard (dependamerge) / Grype Audit SBOM
            Multi-Arch / SBOM x64
            Multi-Arch / SBOM arm64
          ALWAYS: |
            Standard (lftools-uv) / Grype Audit SBOM
          RESOLVED: |
            Fixture (grype-gate) / Grype Audit SBOM
        run: |
          # Assert the gate follows the dependency verdict
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          # shellcheck source=/dev/null
          . "${RUNNER_TEMP}/gh-api.sh"
          api="repos/${REPOSITORY}/actions/runs/${RUN_ID}"
          # One row per job: its name, verdict, and the name and verdict
          # of its 'Grype gate active' step, or 'absent'. Small pages:
          # each job carries its steps, and a page of 100 outruns the
          # API gateway timeout and answers 502
          jobs="$(gh_api --paginate "${api}/jobs?filter=latest&per_page=30" \
            --jq '.jobs[] | [.name, (.conclusion // .status),
              ([.steps[]? | select(.name | startswith("Grype gate active"))
                | .name] | first // "absent"),
              ([.steps[]? | select(.name | startswith("Grype gate active"))
                | (.conclusion // .status)] | first // "absent")]
              | @tsv')"
          # $1 job name, $2 expected step name or '*', $3 expected step
          # conclusion
          check() {
            local row result name conclusion
            row="$(awk -F'\t' -v n="$1" '$1 == n' <<< "${jobs}")"
            result="$(cut -f2 <<< "${row}")"
            name="$(cut -f3 <<< "${row}")"
            conclusion="$(cut -f4 <<< "${row}")"
            case "${result}" in
              success|failure) ;;
              '') fail "$1: no such job in this run"; return ;;
              *) fail "$1: ${result//$'\n'/ }, expected it to run"; return ;;
            esac
            if [ "${conclusion}" != "$3" ]; then
              fail "$1: gate step '${name}' ${conclusion//$'\n'/ }," \
                "expected $3"
            elif [ "$2" != '*' ] && [ "${name}" != "$2" ]; then
              fail "$1: gate step named '${name//$'\n'/ }', expected '$2'"
            else
              echo "$1: ${result}; gate step '${name}' ${conclusion} ✅"
            fi
          }
          while read -r job; do
            if [ -n "${job}" ]; then
              check "${job}" 'Grype gate active: true' success
            fi
          done <<< "${ARMED}"
          while read -r job; do
            if [ -n "${job}" ]; then
              check "${job}" '*' skipped
            fi
          done <<< "${ALWAYS}"
          while read -r job; do
            if [ -n "${job}" ]; then
              check "${job}" 'Grype gate active: false' success
            fi
          done <<< "${RESOLVED}"
          exit "${status}"
