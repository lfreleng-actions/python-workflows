---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable Python build/test/release pipeline (multiple architectures).
#
# Reproduces the canonical Linux Foundation Python release pipeline,
# fanned out across an architecture matrix (x64 + arm64 by default). The
# repository-metadata job runs in parallel as an informational step.
# After python-build, audit and the SBOM/Grype scan run in parallel;
# python-tests is deferred until they pass, then the release is promoted.
# PyPI publishing is performed by the CALLER (see the attach-artefacts
# note below):
#   tag-validate -> python-metadata -> python-build (matrixed) ->
#   { python-audit (matrixed) | sbom (per-arch, scans in-leg) } ->
#   python-tests -> attach-artefacts -> promote-release
#   python-build -> cbom
#
# Each matrixed build/test/audit job runs on a 2-D matrix of architecture
# (from the `runners` input) crossed with Python version (discovered by
# the python-metadata job). The SBOM + Grype job runs per-arch only,
# because native dependency trees differ per architecture but not per
# Python version, and scans the SBOM in the leg that generated it, so
# no job downloads an SBOM artefact that another call of this workflow
# in the same run may have replaced. The cbom job is not matrixed at
# all: it statically
# scans the source tree, which varies by neither axis. It hangs off
# python-build on its own edge because it appears in no other job's
# needs, gating neither python-tests nor the release, and it cannot
# fail the run; see the job for why that is pinned rather than
# configurable.
#
# Native pre-build steps (system packages, C builds) are supplied by the
# consumer through the optional `setup_script` hook, which runs in every
# matrixed job type after checkout and before the action.
#
# Call this from a thin caller workflow on a tag push; see
# examples/build-test-release-multiarch/ for both a plain GitHub-native
# caller and a Gerrit-wrapped caller.
name: '[R] Python Build/Test/Release Multi-Arch'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout / build ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'
      build_formats:
        description: >-
          Build formats: 'sdist', 'wheel', or 'both'. The primary matrix
          leg (first runners entry, first Python version) builds these
          formats; every other leg builds wheels and uploads them
          without any sdist (tox_build ignores this input), so the
          merged dist-* artefacts never hold more than one sdist.
        required: false
        type: string
        default: ''
      tox_build:
        description: 'Build the project using tox'
        required: false
        type: boolean
        default: false

      # --- Multi-architecture build ---
      runners:
        description: >-
          JSON array of {runner, arch} objects defining the architecture
          matrix. 'runner' supplies runs-on; 'arch' names artefacts. The
          default includes ubuntu-24.04-arm; GitHub-hosted arm64 runners
          are freely available on public repositories, so private repos
          may need to override this input. Entries times Python versions
          may not exceed 32 build legs.
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: '[{"runner":"ubuntu-latest","arch":"x64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]'
      auditwheel:
        description: 'Repair Linux wheels with auditwheel (manylinux)'
        required: false
        type: boolean
        default: true
      manylinux_version:
        description: 'manylinux platform tag for auditwheel repair'
        required: false
        type: string
        default: 'manylinux_2_38'
      make:
        description: 'Run make targets via python-build-action'
        required: false
        type: boolean
        default: false
      make_args:
        description: 'Arguments passed to make-action (via python-build)'
        required: false
        type: string
        default: ''
      setup_script:
        description: >-
          Path to a committed setup script run after checkout in every
          matrixed job (build/test/audit/sbom). Empty = skip.
        required: false
        type: string
        default: ''
      ld_library_path:
        description: 'LD_LIBRARY_PATH exported for the test step'
        required: false
        type: string
        default: ''

      # --- Tests ---
      tests_enabled:
        description: 'Run the tests job (set false to skip tests)'
        required: false
        type: boolean
        default: true
      tox_tests:
        description: 'Run tests using tox'
        required: false
        type: boolean
        default: false
      tox_envs:
        description: 'Comma-separated list of tox environments to run'
        required: false
        type: string
        default: ''
      tests_path:
        description: 'Path to the test directory'
        required: false
        type: string
        default: ''
      pytest_args:
        description: 'Extra arguments passed to pytest'
        required: false
        type: string
        default: ''
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false
      test_artifact_path:
        description: >-
          Path (relative to path_prefix) of test output/reports to
          upload as a workflow artefact; empty disables the upload
        required: false
        type: string
        default: ''

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false
      audit_ignore_vulns:
        description: 'Vulnerability identifiers to ignore during the audit'
        required: false
        type: string
        default: ''
      audit_allow_list_config:
        description: 'Allow-list config reference for python-audit-action'
        required: false
        type: string
        default: ''

      # --- Artefact naming ---
      artifact_suffix:
        description: >-
          Suffix appended to the SBOM, Grype and CBOM artefact names, so
          a caller that invokes this workflow more than once in a run
          (from a matrix, say) keeps each leg's artefacts apart. Pass
          the leading hyphen yourself ('-<leg>'); the workflow adds no
          separator. Allowed characters: A-Z a-z 0-9 . _ -
        required: false
        type: string
        default: ''

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype scan
          reads the SBOM, so skipping generation leaves it nothing to
          scan. To keep the SBOM but drop the scan, use grype_enabled.
        required: false
        type: boolean
        default: true
      sbom_include_dev:
        description: 'Include development dependencies in the SBOM'
        required: false
        type: boolean
        default: false
      sbom_format:
        description: "SBOM output format: 'json' or 'both'"
        required: false
        type: string
        default: 'both'

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # A release always gates, so there is no grype_gate_when here;
      # the policy inputs below match build-test.yaml so a caller can
      # carry one configuration across both.
      grype_dependency_policy:
        description: >-
          Which Grype findings gate: 'all', or 'declared' to gate only
          on packages the project declares and report inherited ones
          as warnings. Classified only when the SBOM names a root
          component; see the README.
        required: false
        type: string
        default: 'declared'
      grype_transitive_fail_on:
        description: >-
          Minimum severity at which an inherited package still gates
          under grype_dependency_policy 'declared': 'none',
          'negligible', 'low', 'medium', 'high' or 'critical'
        required: false
        type: string
        default: 'critical'
      grype_only_fixed:
        description: >-
          Gate only on findings with a published fix; one nobody can
          act on yet is reported as a warning instead
        required: false
        type: boolean
        default: true
      grype_remediation_window_days:
        description: >-
          Remediation window in whole days, validated and passed through
          for parity with build-test.yaml. A release always gates, so
          the window changes nothing here; empty turns it off.
        required: false
        type: string
        default: ''
      grype_remediation_window_start:
        description: >-
          Optional YYYY-MM-DD floor for the remediation window clock,
          validated and passed through for parity with build-test.yaml.
          Empty sets no floor.
        required: false
        type: string
        default: ''
      grype_bypass_repository:
        description: >-
          Repository, as owner/name, holding the approved CVE bypass
          issues the Grype scan honours. Empty uses the calling
          repository.
        required: false
        type: string
        default: ''

      # --- CBOM (informational) ---
      # A CBOM records which cryptographic algorithms, key sizes, modes
      # and protocols the code actually calls, which an SBOM cannot
      # express, and it feeds post-quantum readiness assessments.
      # Python coverage is the pyca/cryptography library.
      #
      # There is deliberately no cbom_permit_fail alongside these: the
      # leg is advisory by contract, so the job pins the action's
      # fail_on_error to false and carries continue-on-error. Callers
      # that do not want the report turn the whole job off instead.
      cbom_enabled:
        description: >-
          Generate a CycloneDX Cryptography Bill of Materials (CBOM).
          Informational: the job never fails the workflow run. Set
          false to drop it.
        required: false
        type: boolean
        default: true
      cbom_languages:
        description: >-
          Comma-separated languages to scan: java, python, go, csharp.
          Empty auto-detects from the checked-out tree, which is right
          for a polyglot repository as well as a plain Python one.
        required: false
        type: string
        default: ''
      cbom_exclude:
        description: >-
          Comma-separated Java regex patterns excluded from scanning.
          Empty keeps the scanner default, which skips test sources.
        required: false
        type: string
        default: ''
      cbom_module_cboms:
        description: >-
          Emit a per-module CBOM alongside the consolidated one, which
          attributes each finding to the module that made it.
        required: false
        type: boolean
        default: true
      cbom_empty_cboms:
        description: >-
          Write CBOM files even when the scan finds no cryptographic
          assets. False uploads nothing for a project that calls none,
          at the cost of losing the evidence that a scan ran.
        required: false
        type: boolean
        default: true

      # --- Job timeouts ---
      build_timeout_minutes:
        description: 'Timeout (minutes) for the build job'
        required: false
        type: number
        default: 20
      test_timeout_minutes:
        description: 'Timeout (minutes) for the tests job'
        required: false
        type: number
        default: 20
      audit_timeout_minutes:
        description: 'Timeout (minutes) for the audit, SBOM and Grype jobs'
        required: false
        type: number
        default: 10
      cbom_timeout_minutes:
        description: >-
          Timeout (minutes) for the CBOM job. Longer than the audit
          jobs because it pulls a container image before it scans.
        required: false
        type: number
        default: 15
      metadata_timeout_minutes:
        description: >-
          Timeout (minutes) for the repository-metadata job. Raise it
          for a repository whose full clone is slow to fetch.
        required: false
        type: number
        default: 5

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      build_permit_egress_traffic:
        description: >
          Run harden-runner in audit mode for the build job only,
          permitting unrestricted egress. Use when the build fetches
          dependencies from CDNs that are impractical to enumerate in the
          allow-list. Other jobs stay governed by harden_runner_egress;
          left unset, the build job follows it too.
        required: false
        type: boolean
        default: false
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

      # --- Release ---
      attestations:
        description: 'Generate build provenance attestations'
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: 'Sign build artefacts with Sigstore'
        required: false
        type: boolean
        default: true

    outputs:
      tag:
        description: 'Validated release tag/version string'
        value: ${{ jobs.tag-validate.outputs.tag }}

permissions: {}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on invalid workflow inputs: the
    # test artefact path, the artefact name suffix, job timeouts, the
    # Grype gate policy, and the Gerrit parameters (when gerrit_refspec
    # is set without the project/branch the Gerrit checkout path also
    # requires). The build-chain root job depends on this, so invalid
    # inputs stop the pipeline early and cleanly. This job always runs
    # (only some validation steps are conditional), so gating
    # dependents on it does not trip GitHub's "skipped need skips
    # dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Validate path_prefix input'
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # Require a relative, non-traversing path: later jobs cd
          # into it and derive artefact/publish paths from it, so an
          # empty value, absolute paths or .. segments could escape
          # the checkout
          # A single trailing slash is tolerated ('./' == '.',
          # 'subdir/' == 'subdir')
          PATH_PREFIX="${PATH_PREFIX%/}"
          if [ "${PATH_PREFIX}" = '.' ]; then
            exit 0
          fi
          if [[ ! "${PATH_PREFIX}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] \
            || [[ "${PATH_PREFIX}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid path_prefix input: ${PATH_PREFIX}"
            exit 1
          fi

      - name: 'Validate test_artifact_path input'
        if: inputs.test_artifact_path != ''
        shell: bash
        env:
          TEST_ARTIFACT_PATH: ${{ inputs.test_artifact_path }}
        run: |
          # Require a relative, non-traversing path (the * wildcard
          # permitted): the tests job joins it onto path_prefix for
          # the artefact upload, so absolute paths or .. segments
          # could pull in files from outside the checkout
          valid='^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*/?$'
          if [[ ! "${TEST_ARTIFACT_PATH}" =~ ${valid} ]] \
            || [[ "${TEST_ARTIFACT_PATH}" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid test_artifact_path input:" \
              "${TEST_ARTIFACT_PATH}"
            exit 1
          fi

      - name: 'Validate artifact_suffix input'
        if: inputs.artifact_suffix != ''
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          # The suffix lands in artefact names, so allow only the
          # characters grype-scan-action accepts in its output prefix
          if [[ ! "${ARTIFACT_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid artifact_suffix input:" \
              "${ARTIFACT_SUFFIX}"
            exit 1
          fi

      - name: 'Validate job timeout inputs'
        shell: bash
        env:
          BUILD_TIMEOUT: ${{ inputs.build_timeout_minutes }}
          TEST_TIMEOUT: ${{ inputs.test_timeout_minutes }}
          AUDIT_TIMEOUT: ${{ inputs.audit_timeout_minutes }}
          CBOM_TIMEOUT: ${{ inputs.cbom_timeout_minutes }}
          METADATA_TIMEOUT: ${{ inputs.metadata_timeout_minutes }}
        run: |
          # Require whole-minute timeouts in the range 1-360 (the
          # GitHub-hosted runner job cap). Values GitHub itself
          # rejects (e.g. fractional numbers) can fail workflow
          # evaluation before this step runs; for values that do
          # reach it (zero, negative or out-of-range), this gives a
          # clear fail-fast error
          error=0
          for entry in \
            "build_timeout_minutes=${BUILD_TIMEOUT}" \
            "test_timeout_minutes=${TEST_TIMEOUT}" \
            "audit_timeout_minutes=${AUDIT_TIMEOUT}" \
            "cbom_timeout_minutes=${CBOM_TIMEOUT}" \
            "metadata_timeout_minutes=${METADATA_TIMEOUT}"; do
            name="${entry%%=*}"; value="${entry#*=}"
            if [[ ! "${value}" =~ ^[0-9]+$ ]] \
              || [ "${value}" -lt 1 ] || [ "${value}" -gt 360 ]; then
              echo "::error::Invalid ${name} input: ${value}"
              error=1
            fi
          done
          exit "${error}"

      # grype-scan-action checks every input it owns before it installs
      # anything, but only once the build and SBOM jobs have run. In
      # validate-only mode it runs that same check against the with:
      # block below and stops: no Grype install, no database, no scan,
      # no network. The block mirrors the scan step's, expression for
      # expression, so the two cannot drift; tests/test-grype-gate-
      # inputs.sh holds them to that. Left out are the values the scan
      # step alone can give: the SBOM, and anything from the needs,
      # matrix or secrets contexts, which this job has no use for.
      - name: 'Validate Grype inputs'
        id: validate-grype
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          validate-only: 'true'
          fail-on: ${{ inputs.grype_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          gate-when: 'always'
          # yamllint disable-line rule:line-length
          remediation-window-days: ${{ inputs.grype_remediation_window_days }}
          # yamllint disable-line rule:line-length
          remediation-window-start: ${{ inputs.grype_remediation_window_start }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          bypass-repository: ${{ inputs.grype_bypass_repository }}

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.metadata_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # Commits and trees only; blobs are fetched on demand. Public
          # repositories only: without persisted credentials a private
          # repository cannot fetch a blob later, and a payload with no
          # repository object (schedule) keeps the full clone. toJSON
          # keeps an absent value ('null') apart from false: '==' would
          # coerce both to 0 and enable the filter.
          filter: >-
            ${{ toJSON(github.event.repository.private) == 'false'
            && 'blob:none' || '' }}
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@18e5b7c5b16423b0e734891d103513826b324858  # v0.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  tag-validate:
    name: 'Validate Tag Push'
    needs: gerrit-validate
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Needed to draft a release
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag-validate.outputs.tag_name }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@eab7d92e02c8b447a4de04e68bd5ee7eae3450eb  # v1.1.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'  # Cannot verify GPG without key

      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag-validate.outputs.tag_name }}
        run: |
          # Ensure draft release exists
          TAG="${TAG_NAME}"
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "::error::A published release already exists for $TAG;" \
                "delete or recreate it as a draft, then re-run."
              exit 1
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  python-metadata:
    name: 'Extract Project Metadata'
    needs: 'tag-validate'
    runs-on: ubuntu-latest
    outputs:
      # Bare JSON array of Python versions consumed by the matrixed jobs.
      versions_json: ${{ steps.versions.outputs.versions_json }}
      # Single version for the unmatrixed SBOM leg: the latest the
      # project supports, as python-build-action would pick.
      # yamllint disable-line rule:line-length
      build_version: ${{ steps.metadata.outputs.python_build_version }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Extract Python project metadata'
        id: metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/build-metadata-action@f5788fd76522ba71a079caaa77b7e50d7a7c5d0f  # v0.11.1
        with:
          path_prefix: ${{ inputs.path_prefix }}
          output_format: summary
          include_environment: true
          use_version_extract: true
          verbose: true

      # Extract the bare version list from the build-metadata matrix
      # object so the matrixed jobs can cross it with the architecture
      # dimension. python-build declares one digest output per matrix
      # leg, 32 in all, so a larger matrix fails here, before building.
      - name: 'Derive Python version matrix'
        id: versions
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.metadata.outputs.python_matrix_json }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          # Derive the bare JSON array of Python versions
          set -euo pipefail
          versions=$(printf '%s' "${MATRIX_JSON}" | \
            jq -c '."python-version"')
          echo "Python versions: ${versions}"
          legs=$(( $(printf '%s' "${RUNNERS}" | jq 'length') \
            * $(printf '%s' "${versions}" | jq 'length') ))
          if [ "${legs}" -gt 32 ]; then
            echo "::error::${legs} build legs exceed the limit of 32"
            exit 1
          fi
          echo "versions_json=${versions}" >> "$GITHUB_OUTPUT"

  python-build:
    name: 'Build ${{ matrix.target.arch }} py${{ matrix.python-version }}'
    needs: 'python-metadata'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.runners) }}
        # yamllint disable-line rule:line-length
        python-version: ${{ fromJson(needs.python-metadata.outputs.versions_json) }}
    runs-on: ${{ matrix.target.runner }}
    env:
      # Only the primary leg (first runner, first Python version) may
      # ship an sdist. Every leg would otherwise upload its own
      # non-reproducible <name>-<version>.tar.gz, and merge-multiple
      # downloads extract them concurrently onto one corrupt path.
      # Expressions compare arrays by identity, so a runner given as a
      # label array is compared in its JSON form.
      # yamllint disable-line rule:line-length
      PRIMARY_LEG: ${{ toJSON(matrix.target.runner) == toJSON(fromJson(inputs.runners)[0].runner) && matrix.target.arch == fromJson(inputs.runners)[0].arch && matrix.python-version == fromJson(needs.python-metadata.outputs.versions_json)[0] }}
    # Each leg sets only the digests_<n> output for its own job index,
    # and GitHub combines a matrix's outputs, so attest-sign can find
    # each leg's digests by artefact name. python-metadata caps the
    # matrix at the 32 declared here.
    outputs:
      digests_0: ${{ steps.artefact-digests.outputs.digests_0 }}
      digests_1: ${{ steps.artefact-digests.outputs.digests_1 }}
      digests_2: ${{ steps.artefact-digests.outputs.digests_2 }}
      digests_3: ${{ steps.artefact-digests.outputs.digests_3 }}
      digests_4: ${{ steps.artefact-digests.outputs.digests_4 }}
      digests_5: ${{ steps.artefact-digests.outputs.digests_5 }}
      digests_6: ${{ steps.artefact-digests.outputs.digests_6 }}
      digests_7: ${{ steps.artefact-digests.outputs.digests_7 }}
      digests_8: ${{ steps.artefact-digests.outputs.digests_8 }}
      digests_9: ${{ steps.artefact-digests.outputs.digests_9 }}
      digests_10: ${{ steps.artefact-digests.outputs.digests_10 }}
      digests_11: ${{ steps.artefact-digests.outputs.digests_11 }}
      digests_12: ${{ steps.artefact-digests.outputs.digests_12 }}
      digests_13: ${{ steps.artefact-digests.outputs.digests_13 }}
      digests_14: ${{ steps.artefact-digests.outputs.digests_14 }}
      digests_15: ${{ steps.artefact-digests.outputs.digests_15 }}
      digests_16: ${{ steps.artefact-digests.outputs.digests_16 }}
      digests_17: ${{ steps.artefact-digests.outputs.digests_17 }}
      digests_18: ${{ steps.artefact-digests.outputs.digests_18 }}
      digests_19: ${{ steps.artefact-digests.outputs.digests_19 }}
      digests_20: ${{ steps.artefact-digests.outputs.digests_20 }}
      digests_21: ${{ steps.artefact-digests.outputs.digests_21 }}
      digests_22: ${{ steps.artefact-digests.outputs.digests_22 }}
      digests_23: ${{ steps.artefact-digests.outputs.digests_23 }}
      digests_24: ${{ steps.artefact-digests.outputs.digests_24 }}
      digests_25: ${{ steps.artefact-digests.outputs.digests_25 }}
      digests_26: ${{ steps.artefact-digests.outputs.digests_26 }}
      digests_27: ${{ steps.artefact-digests.outputs.digests_27 }}
      digests_28: ${{ steps.artefact-digests.outputs.digests_28 }}
      digests_29: ${{ steps.artefact-digests.outputs.digests_29 }}
      digests_30: ${{ steps.artefact-digests.outputs.digests_30 }}
      digests_31: ${{ steps.artefact-digests.outputs.digests_31 }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    steps:
      # The build job can opt into audit egress independently of the
      # other jobs via build_permit_egress_traffic, for dependency
      # fetches from CDNs impractical to enumerate in the allow-list.
      # Left unset it follows harden_runner_egress like every other job.
      #
      # One harden-runner step with the policy computed, rather than
      # two selected by condition: harden-runner declares a 'pre'
      # entry point and no 'pre-if', so its pre-phase runs whatever a
      # step-level 'if:' says. Both would engage the agent, the first
      # would win, and audit mode would be unreachable.
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ (inputs.build_permit_egress_traffic || inputs.harden_runner_egress == 'audit') && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Validate setup script path'
        if: inputs.setup_script != ''
        id: setup-script-check
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/path-check-action@fb77045699ead7bb7014186ae23e4935ce277a21  # v0.2.3
        with:
          path: ${{ inputs.setup_script }}
      - name: 'Run setup script'
        if: inputs.setup_script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          SCRIPT_TYPE: ${{ steps.setup-script-check.outputs.type }}
        run: |
          # Run the consumer-supplied native setup script
          if [ "${SCRIPT_TYPE}" != 'file' ]; then
            echo "::error::setup_script '${SETUP_SCRIPT}' is not a file"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"

      - name: 'Build Python project ${{ matrix.python-version }}'
        id: python-build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3cdb6f8e3b9c6c8fb21cce123f7b873b3620273d  # v2.1.1
        with:
          # yamllint disable-line rule:line-length
          artefact_name: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          path_prefix: ${{ inputs.path_prefix }}
          python_version: ${{ matrix.python-version }}
          # yamllint disable-line rule:line-length
          build_formats: ${{ env.PRIMARY_LEG == 'true' && (inputs.build_formats || 'both') || 'wheel' }}
          # Other legs upload below, after dropping any sdist
          artefact_upload: ${{ env.PRIMARY_LEG }}
          tox_build: ${{ inputs.tox_build }}
          auditwheel: ${{ inputs.auditwheel }}
          manylinux_version: ${{ inputs.manylinux_version }}
          make: ${{ inputs.make }}
          make_args: ${{ inputs.make_args }}
          # attest-sign does both, away from the project's build code
          sigstore_sign: 'false'
          attestations: 'false'

      # tox_build runs the project's own tox build environment, which
      # ignores build_formats, so a non-primary leg prunes any sdist
      # itself before uploading rather than trust the build to omit it.
      - name: 'Drop sdist from non-primary leg'
        if: env.PRIMARY_LEG != 'true'
        shell: bash
        env:
          ARTEFACT_PATH: ${{ steps.python-build.outputs.artefact_path }}
        run: |
          # Keep wheels only in this leg's artefact
          set -euo pipefail
          shopt -s nullglob
          for file in "${ARTEFACT_PATH}"/*.tar.gz*; do
            echo "Dropping ${file}"
            rm -f -- "${file}"
          done
          wheels=("${ARTEFACT_PATH}"/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::No wheel in ${ARTEFACT_PATH}"
            exit 1
          fi
      - name: 'Upload build artefacts'
        if: env.PRIMARY_LEG != 'true'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          path: ${{ steps.python-build.outputs.artefact_path }}
          if-no-files-found: error

      # attest-sign checks its download against these, so it attests
      # and signs exactly the files this leg built. upload-artifact
      # skips hidden files, so the list does too.
      - name: 'Record artefact digests'
        id: artefact-digests
        shell: bash
        env:
          ARTEFACT_PATH: ${{ steps.python-build.outputs.artefact_path }}
          # yamllint disable-line rule:line-length
          ARTEFACT_NAME: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          # Record a SHA-256 digest for each uploaded build artefact
          set -euo pipefail
          cd "${ARTEFACT_PATH}"
          digests="$(find . -type f ! -path '*/.*' -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum)"
          if [ -z "${digests}" ]; then
            echo "::error::No build artefacts in ${ARTEFACT_PATH}"
            exit 1
          fi
          printf '%s\n' "${digests}"
          record="$(jq -cn --arg name "${ARTEFACT_NAME}" \
            --arg digests "${digests}" \
            '{name: $name, digests: $digests}')"
          echo "digests_${JOB_INDEX}=${record}" >> "$GITHUB_OUTPUT"

  # Attestation and signing need the job's OIDC token, which any code
  # in the job could request. python-build runs the project's own build
  # code, so it holds no token; this job holds one and runs no project
  # code. Each leg checks nothing out and handles only its build leg's
  # dist-* artefact, after matching it against the digests that leg
  # recorded. The other jobs that run project code (python-audit,
  # sbom, python-tests) also wait for this one, leaving the build legs
  # as the only project code that runs before signing. Signing adds a
  # <file>.sigstore.json bundle beside each file, so the signed set
  # replaces the leg's artefact under the same name.
  attest-sign:
    name: 'Attest/Sign ${{ matrix.target.arch }} py${{ matrix.python-version }}'
    needs: ['python-metadata', 'python-build']
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.runners) }}
        # yamllint disable-line rule:line-length
        python-version: ${{ fromJson(needs.python-metadata.outputs.versions_json) }}
    # Runs no build, so it needs no native runner for the architecture
    runs-on: 'ubuntu-latest'
    env:
      # The same primary leg python-build picks to ship the sdist
      # yamllint disable-line rule:line-length
      PRIMARY_LEG: ${{ toJSON(matrix.target.runner) == toJSON(fromJson(inputs.runners)[0].runner) && matrix.target.arch == fromJson(inputs.runners)[0].arch && matrix.python-version == fromJson(needs.python-metadata.outputs.versions_json)[0] }}
    permissions:
      contents: read
      id-token: write       # Needed for attestations and signing
      attestations: write   # Needed for attestations
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          # yamllint disable-line rule:line-length
          name: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          path: 'dist'

      # Every downloaded file counts, hidden ones included: the build's
      # upload skips them, so one here was not built, and attest would
      # otherwise cover it through dist/*. A re-run downloads the set
      # an earlier attempt signed, so the bundle beside each file is
      # dropped first and the file signed again.
      - name: 'Verify artefact digests'
        shell: bash
        env:
          BUILD_OUTPUTS: ${{ toJSON(needs.python-build.outputs) }}
          # yamllint disable-line rule:line-length
          ARTEFACT_NAME: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
        run: |
          # Fail unless dist/ holds exactly the files the build leg hashed
          set -euo pipefail
          expected="$(printf '%s' "${BUILD_OUTPUTS}" \
            | jq -r --arg name "${ARTEFACT_NAME}" '
              [.[] | (fromjson? // empty)
                | select(type == "object" and .name == $name)]
              | if length == 1 then .[0].digests
                else error("\(length) digest records for \($name)")
                end')"
          if [ -z "${expected}" ]; then
            echo "::error::No artefact digests for ${ARTEFACT_NAME}"
            exit 1
          fi
          cd dist
          while IFS= read -r -d '' bundle; do
            if [ -f "${bundle%.sigstore.json}" ]; then
              echo "Dropping earlier signature ${bundle}"
              rm -f -- "${bundle}"
            fi
          done < <(find . -type f -name '*.sigstore.json' -print0)
          if [ -n "$(find . ! -type f ! -type d -print -quit)" ]; then
            echo "::error::Downloaded artefacts hold non-regular files"
            exit 1
          fi
          actual="$(find . -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 -r sha256sum)"
          if ! diff <(printf '%s\n' "${expected}") \
              <(printf '%s\n' "${actual}"); then
            echo "::error::Downloaded artefacts differ from the build"
            exit 1
          fi
          echo "Verified build artefacts:"
          printf '%s\n' "${actual}"

      - name: 'Attest build provenance'
        if: inputs.attestations
        # yamllint disable-line rule:line-length
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: 'dist/*'

      # Signs the formats the build leg built, as python-build-action
      # did when it signed in the build job: build_formats on the
      # primary leg, wheels on every other.
      - name: 'Select files to sign'
        id: sign-files
        if: inputs.sigstore_sign
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          BUILD_FORMATS: ${{ env.PRIMARY_LEG == 'true' && (inputs.build_formats || 'both') || 'wheel' }}
        run: |
          # List the wheels and sdists to sign
          set -euo pipefail
          shopt -s nullglob
          files=()
          if [ "${BUILD_FORMATS}" != 'wheel' ]; then
            files+=(dist/*.tar.gz)
          fi
          if [ "${BUILD_FORMATS}" != 'sdist' ]; then
            files+=(dist/*.whl)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No files found to sign"
            exit 1
          fi
          {
            echo 'files<<EOF_FILES'
            printf '%s\n' "${files[@]}"
            echo 'EOF_FILES'
          } >> "$GITHUB_OUTPUT"
      - name: 'Sign artefacts with Sigstore'
        if: inputs.sigstore_sign
        # yamllint disable-line rule:line-length
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ${{ steps.sign-files.outputs.files }}

      # Attestation leaves the files untouched, so only signing, which
      # adds the bundles, needs the artefact replaced.
      - name: 'Upload signed artefacts'
        if: inputs.sigstore_sign
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          path: 'dist'
          if-no-files-found: error
          overwrite: true

  # Release variant: gate downstream strictly on python-build success.
  # A broken build means no release, so there is no value in running
  # the test/audit matrix. (The non-release variant instead gates on
  # python-metadata to surface every failure on a PR.)
  python-tests:
    name: 'Tests ${{ matrix.target.arch }} py${{ matrix.python-version }}'
    # Deferred until the audit operations (python-audit and the SBOM
    # job, whose in-leg Grype scan fails it) pass, so the expensive
    # test matrix is skipped on audit failure. Disabled audit/SBOM jobs
    # report 'skipped' and do not block the tests, but the direct sbom
    # check keeps a genuine SBOM or Grype failure gating the tests.
    # attest-sign runs first so no test code runs before signing.
    needs:
      - 'python-metadata'
      - 'python-build'
      - 'attest-sign'
      - 'python-audit'
      - 'sbom'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.python-build.result == 'success' && needs.attest-sign.result == 'success' && (needs.python-audit.result == 'success' || (needs.python-audit.result == 'skipped' && !inputs.audit_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) && inputs.tests_enabled }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.runners) }}
        # yamllint disable-line rule:line-length
        python-version: ${{ fromJson(needs.python-metadata.outputs.versions_json) }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.test_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Validate setup script path'
        if: inputs.setup_script != ''
        id: setup-script-check
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/path-check-action@fb77045699ead7bb7014186ae23e4935ce277a21  # v0.2.3
        with:
          path: ${{ inputs.setup_script }}
      - name: 'Run setup script'
        if: inputs.setup_script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          SCRIPT_TYPE: ${{ steps.setup-script-check.outputs.type }}
        run: |
          # Run the consumer-supplied native setup script
          if [ "${SCRIPT_TYPE}" != 'file' ]; then
            echo "::error::setup_script '${SETUP_SCRIPT}' is not a file"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"

      - name: 'Python tests [pytest] ${{ matrix.python-version }}'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@0c2fe7546faea2321e003c1c3b26a9156a7bc432  # v1.3.1
        env:
          LD_LIBRARY_PATH: ${{ inputs.ld_library_path }}
        with:
          python_version: ${{ matrix.python-version }}
          path_prefix: ${{ inputs.path_prefix }}
          tox_tests: ${{ inputs.tox_tests }}
          tox_envs: ${{ inputs.tox_envs }}
          tests_path: ${{ inputs.tests_path }}
          pytest_args: ${{ inputs.pytest_args }}
          permit_fail: ${{ inputs.test_permit_fail }}
          # yamllint disable-line rule:line-length
          artefact_name: coverage-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Upload test artefacts'
        if: ${{ !cancelled() && inputs.test_artifact_path != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: python-test-results-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          path: ${{ inputs.path_prefix }}/${{ inputs.test_artifact_path }}
          retention-days: 7
          if-no-files-found: warn

  python-audit:
    name: 'Audit ${{ matrix.target.arch }} py${{ matrix.python-version }}'
    needs: ['python-metadata', 'python-build', 'attest-sign']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.python-build.result == 'success' && needs.attest-sign.result == 'success' && inputs.audit_enabled }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.runners) }}
        # yamllint disable-line rule:line-length
        python-version: ${{ fromJson(needs.python-metadata.outputs.versions_json) }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Validate setup script path'
        if: inputs.setup_script != ''
        id: setup-script-check
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/path-check-action@fb77045699ead7bb7014186ae23e4935ce277a21  # v0.2.3
        with:
          path: ${{ inputs.setup_script }}
      - name: 'Run setup script'
        if: inputs.setup_script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          SCRIPT_TYPE: ${{ steps.setup-script-check.outputs.type }}
        run: |
          # Run the consumer-supplied native setup script
          if [ "${SCRIPT_TYPE}" != 'file' ]; then
            echo "::error::setup_script '${SETUP_SCRIPT}' is not a file"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"

      - name: 'Audit dependencies ${{ matrix.python-version }}'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-audit-action@47af793a2a28882b10ceb9109646cbbcecc2e7b0  # v0.6.1
        with:
          python_version: ${{ matrix.python-version }}
          path_prefix: ${{ inputs.path_prefix }}
          permit_fail: ${{ inputs.audit_permit_fail }}
          ignore_vulns: ${{ inputs.audit_ignore_vulns }}
          config: ${{ inputs.audit_allow_list_config }}
          # yamllint disable-line rule:line-length
          artefact_name: dist-${{ matrix.target.arch }}-py${{ matrix.python-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: 'SBOM ${{ matrix.target.arch }}'
    needs: ['python-metadata', 'python-build', 'attest-sign']
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.python-build.result == 'success' && needs.attest-sign.result == 'success' && inputs.sbom_enabled }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.runners) }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.audit_timeout_minutes }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Validate setup script path'
        if: inputs.setup_script != ''
        id: setup-script-check
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/path-check-action@fb77045699ead7bb7014186ae23e4935ce277a21  # v0.2.3
        with:
          path: ${{ inputs.setup_script }}
      - name: 'Run setup script'
        if: inputs.setup_script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          SCRIPT_TYPE: ${{ steps.setup-script-check.outputs.type }}
        run: |
          # Run the consumer-supplied native setup script
          if [ "${SCRIPT_TYPE}" != 'file' ]; then
            echo "::error::setup_script '${SETUP_SCRIPT}' is not a file"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"

      - name: 'Generate SBOM (${{ matrix.target.arch }})'
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sbom-action@73cdda97132f74a64733b238747d34151444da15  # v0.7.0
        with:
          backend: 'python'
          # Earlier jobs in this run already install and execute the
          # same checkout, with the same read-only permissions, so this
          # job adds no exposure. 'auto' would skip fork pull requests
          # and merge queues, leaving the Grype audit with no SBOM.
          untrusted_checkout: 'false'
          # The build's interpreter, chosen from project metadata: the
          # backend binds uv to python_version, so its 3.12 default
          # would fail projects requiring a newer Python
          # yamllint disable-line rule:line-length
          python_version: ${{ needs.python-metadata.outputs.build_version }}
          path_prefix: ${{ inputs.path_prefix }}
          include_dev: ${{ inputs.sbom_include_dev }}
          # The Grype job scans the JSON SBOM, so JSON must
          # always exist. sbom_format is documented as 'json' or
          # 'both'; a stray, undocumented 'xml' is coerced to 'both'
          # because workflow_call inputs cannot enforce an enum.
          # yamllint disable-line rule:line-length
          sbom_format: ${{ inputs.sbom_format == 'xml' && 'both' || inputs.sbom_format }}

      - name: 'Upload SBOM artifacts'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: sbom-files${{ inputs.artifact_suffix }}-${{ matrix.target.arch }}
          # Glob matches whichever SBOM formats sbom_format produced
          path: sbom-cyclonedx.*
          retention-days: 45
          if-no-files-found: warn

      - name: 'SBOM summary'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target.arch }}
          SBOM_COMPONENT_COUNT: ${{ steps.sbom.outputs.component_count }}
          SBOM_DEPENDENCY_MANAGER: ${{ steps.sbom.outputs.dependency_manager }}
        run: |
          # SBOM summary
          {
            echo "## SBOM Summary ($TARGET_ARCH)"
            echo "SBOM count: ${SBOM_COMPONENT_COUNT}"
            echo "Tool used: ${SBOM_DEPENDENCY_MANAGER}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Scans the SBOM this leg generated, in the same job, so the
      # scan is bound to the SBOM by construction. A matrix job cannot
      # export one artefact ID per leg, so a separate Grype job would
      # have to download by name, and when a caller runs this workflow
      # more than once in a run without a distinct artifact_suffix a
      # lookup by name can hand it another call's SBOM.
      #
      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        if: ${{ inputs.grype_enabled }}
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx.json'
          name: ${{ matrix.target.arch }}
          fail-on: ${{ inputs.grype_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          # A release always gates: no dependency-change detection runs
          # in this workflow, and no manifest is read
          gate-when: 'always'
          # yamllint disable-line rule:line-length
          remediation-window-days: ${{ inputs.grype_remediation_window_days }}
          # yamllint disable-line rule:line-length
          remediation-window-start: ${{ inputs.grype_remediation_window_start }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # yamllint disable-line rule:line-length
          artifact-name: grype-scan-results${{ inputs.artifact_suffix }}-${{ matrix.target.arch }}
          bypass-repository: ${{ inputs.grype_bypass_repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Informational leg. Nothing downstream reads the CBOM, so this job
  # sits beside the audit and SBOM legs rather than in sequence with
  # them, and delays none of them. It remains a job in the run, though,
  # and a run is not complete until every job is, so a scan that
  # outlasts every other branch does extend the total. Observed at
  # 46-55 seconds against the self-test consumers, well inside the
  # build; cbom_timeout_minutes bounds the pathological case.
  #
  # It cannot fail the run. Three things could otherwise: a scanner
  # error (the action's fail_on_error is pinned false), a runner or
  # input problem the action rejects outright, and the job timeout.
  # continue-on-error covers all three, because the value of a CBOM is
  # the report it produces, never a verdict it withholds. Callers who
  # do not want the report set cbom_enabled false.
  #
  # Unmatrixed, unlike every other job downstream of python-build. The
  # matrix exists because installed dependency trees differ by
  # architecture and by Python version; a CBOM scan reads the source
  # tree statically and sees the same bytes on every cell, so fanning it
  # out would buy identical reports at N times the runner cost. It runs
  # on ubuntu-latest for the same reason, and because the scanner ships
  # as a container the runner has to be able to pull and run.
  #
  # setup_script is not called here either: that hook exists to satisfy
  # native build dependencies, and this job builds nothing.
  #
  # It sits outside the gating inversion the audit legs impose: it does
  # not gate python-tests, and it does not join the release assets.
  # attach-artefacts publishes what a consumer verifies a download
  # against, and a job permitted to fail would attach its output at
  # random, so the CBOM uploads as a workflow artefact instead.
  cbom:
    name: 'Generate CBOM'
    runs-on: ubuntu-latest
    needs: 'python-build'
    continue-on-error: true
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.python-build.result == 'success' && inputs.cbom_enabled }}
    timeout-minutes: ${{ inputs.cbom_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          # The scanner is a container, so the image pull needs the
          # registry endpoints. The organisation allow-list already
          # carries both; naming them here keeps the job working when a
          # caller points harden_runner_allowlist at a narrower list.
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The action writes its own job summary (languages scanned,
      # asset count, file count), so no summary step follows.
      #
      # Known limitation: the CBOM's metadata block (gitUrl, revision,
      # commit) comes from the run's own GITHUB_* context, which names
      # the CALLING repository and commit. Where 'repository' or 'ref'
      # selects a different tree, and on a Gerrit-sourced run where the
      # checked-out change is not the mirror commit, that metadata
      # describes the caller rather than the source scanned. The
      # cryptographic findings are unaffected. Fixing it needs explicit
      # metadata inputs on cbom-action, which has none today.
      #
      # Its 'image' input is not surfaced as a workflow input. The
      # default is a digest that travels with the action version pinned
      # above, and a workflow input defaulting to empty cannot fall
      # through to it: a composite action applies a default only when
      # the input is absent, never when it arrives empty. Restating
      # the digest here instead would fork the pin from the action that
      # owns it. Bump the action to move the scanner.
      - name: 'Generate CBOM'
        id: cbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/cbom-action@ec9253d00fccbe103002ada6067224ec767a7b1c  # v0.0.2
        with:
          path_prefix: ${{ inputs.path_prefix }}
          # Reports go to runner temp, never the workspace. The action
          # defaults output_directory to '.', and its file_count and
          # cbom_pattern outputs cover every cbom*.json sitting in that
          # directory rather than only the files this scan wrote. A
          # project that tracks its own cbom.json at the repository
          # root would otherwise have it overwritten, counted as scan
          # output and uploaded as though this job produced it. An
          # empty directory per job keeps the outputs describing this
          # scan alone.
          output_directory: ${{ runner.temp }}/cbom
          languages: ${{ inputs.cbom_languages }}
          exclude: ${{ inputs.cbom_exclude }}
          module_cboms: ${{ inputs.cbom_module_cboms }}
          empty_cboms: ${{ inputs.cbom_empty_cboms }}
          # Pinned rather than exposed. continue-on-error above already
          # absorbs the failure, so an input offering to flip this
          # would promise a gate the job cannot deliver.
          fail_on_error: 'false'

      - name: 'Upload CBOM artifacts'
        if: ${{ steps.cbom.outputs.file_count != '0' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # No arch suffix, unlike the per-arch SBOM artefacts: one
          # scan, one artefact. artifact_suffix still applies.
          name: cbom-files${{ inputs.artifact_suffix }}
          # Absolute glob under runner temp, covering the consolidated
          # CBOM and, when cbom_module_cboms is on, the per-module files
          # beside it. upload-artifact roots the archive at the common
          # ancestor, so the files land at the artefact root.
          path: ${{ steps.cbom.outputs.cbom_pattern }}
          retention-days: 45
          # The condition above already skips an empty scan, so a miss
          # here is a surprise worth logging but not worth failing an
          # informational job over.
          if-no-files-found: warn

  # Attach build artefacts prior to release promotion
  # This enables the GitHub immutable releases feature
  #
  # NOTE: PyPI publishing is intentionally NOT performed by this reusable
  # workflow. Trusted publishing matches the OIDC job_workflow_ref claim
  # against the calling repository, so the caller MUST run the publish
  # steps itself. This workflow stops at promoting the GitHub release; the
  # caller stacks the Test PyPI/PyPI publish jobs after it, consuming the
  # run-scoped 'dist-*' build artefacts and the workflow's 'tag' output.
  #
  # The multi-arch build job is matrixed (arch x version) and therefore
  # produces multiple dist-* artefacts rather than a single named one;
  # they are merged into a shared dist/ directory before attachment.
  attach-artefacts:
    name: 'Attach Artefacts to Release'
    runs-on: 'ubuntu-latest'
    needs:
      - 'tag-validate'
      - 'python-build'
      - 'attest-sign'
      - 'python-tests'
      - 'python-audit'
      - 'sbom'
    # tests/audit/sbom skip when their enable toggles are false;
    # tolerate skipped results, but never a failure (a failed test run,
    # audit, SBOM or in-leg Grype scan blocks the release here)
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.python-build.result == 'success' && needs.attest-sign.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.python-tests.result) && (needs.python-audit.result == 'success' || (needs.python-audit.result == 'skipped' && !inputs.audit_enabled)) && (needs.sbom.result == 'success' || (needs.sbom.result == 'skipped' && !inputs.sbom_enabled)) }}
    permissions:
      contents: write  # IMPORTANT: needed to edit release, attach artefacts
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: 'dist-*'
          path: 'dist'
          merge-multiple: true

      # merge-multiple extracts artefacts concurrently into dist/, so
      # same-named sdists from several legs collapse onto one path and
      # leave a corrupt file. Stop here rather than publish it.
      - name: 'Verify merged sdist'
        shell: bash
        env:
          BUILD_FORMATS: ${{ inputs.build_formats || 'both' }}
        run: |
          # Reject a missing, duplicated or corrupt sdist in dist/
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          echo "Source distributions in dist/: ${#sdists[@]}"
          failed=0
          if [ "${BUILD_FORMATS}" != 'wheel' ] \
            && [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::build_formats '${BUILD_FORMATS}' expects an sdist"
            failed=1
          fi
          declare -A seen=()
          for sdist in "${sdists[@]}"; do
            base="$(basename "${sdist}" .tar.gz)"
            # PEP 625: <normalised name>-<version>; key on the PEP 503
            # normalised name so case or separator variants still clash
            name="$(printf '%s' "${base%-*}" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[-_.]+/-/g')"
            key="${name}-${base##*-}"
            if [ -n "${seen[${key}]:-}" ]; then
              echo "::error::Duplicate sdist for ${key}:" \
                "${seen[${key}]} and ${sdist}"
              failed=1
            else
              seen[${key}]="${sdist}"
            fi
            if ! gzip -t "${sdist}"; then
              echo "::error::sdist fails gzip -t: ${sdist}"
              failed=1
            elif ! tar -tzf "${sdist}" > /dev/null; then
              echo "::error::sdist fails tar -tzf: ${sdist}"
              failed=1
            else
              echo "Verified: ${sdist}"
            fi
          done
          exit "${failed}"

      - name: 'Attach build artefacts to release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/release-assets-action@d7b650fbf8fbca7a436f75ddada3d4cdbd36a802  # v0.1.4
        with:
          asset_paths: '["dist/**"]'
          release_tag: ${{ needs.tag-validate.outputs.tag }}

  promote-release:
    name: 'Promote Draft Release'
    needs:
      - 'tag-validate'
      - 'attach-artefacts'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # IMPORTANT: needed for draft release promotion
    timeout-minutes: 2
    outputs:
      # yamllint disable-line rule:line-length
      release_url: ${{ steps.promote-release.outputs.release_url || steps.set-promoted-url.outputs.release_url }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
          allow_list_summary: 'false'
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: 'Check if release is already promoted'
        id: 'check-promoted'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.tag-validate.outputs.tag }}
        run: |
          TAG="${TAG_NAME}"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' \
              2>/dev/null | grep -q "false"; then
            echo "Release $TAG is already promoted, skipping promotion"
            echo "already_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is draft or doesn't exist, " \
                 "proceeding with promotion"
            echo "already_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Promote draft release'
        id: 'promote-release'
        if: steps.check-promoted.outputs.already_promoted == 'false'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@358264a2efca5ac359a90718373cbce18016bd27  # v0.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.tag-validate.outputs.tag }}
          latest: true

      - name: 'Set release URL for already promoted release'
        id: 'set-promoted-url'
        if: steps.check-promoted.outputs.already_promoted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.tag-validate.outputs.tag }}
        run: |
          TAG="${TAG_NAME}"
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
